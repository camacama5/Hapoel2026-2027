<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ניחוש טבלת הליגה</title>
  <link rel="stylesheet" href="css/style.css?v=9" />
</head>
<body>
  <div class="app" id="app">
    <header class="page-header">
      <img class="page-header__logo" src="logos/hapoel_haifa.png" alt="" onerror="this.style.display='none'" />
      <p class="page-header__title">משחק הניחושים של אוהדי הפועל</p>
      <p class="page-header__tagline">יודעים איך תראה הטבלה בסוף העונה?</p>
      <p class="page-header__subtitle">
        סדרו את 15 הקבוצות מהמקום הראשון ועד האחרון, לפי הניחוש שלכם לסיום העונה.
        אל תשכחו לרשום שם, ולהיות בטוחים בבחירה שלכם, ולאחר השליחה לא ניתן לשנות את הטבלה.
      </p>
    </header>

    <div class="status-bar">
      <span class="status-bar__count" id="progress-count">0 / 15 מולאו</span>
      <span class="status-bar__track">
        <span class="status-bar__fill" id="progress-fill"></span>
      </span>
    </div>

    <section class="name-section">
      <label class="field-label" for="participant-name">השם שלך</label>
      <input
        type="text"
        id="participant-name"
        class="name-input"
        placeholder="לדוגמה: דני"
        autocomplete="off"
      />
    </section>

    <div class="layout">
      <div class="slots" id="slots">
        <!-- 15 השורות נבנות דינמית ע"י js/app.js -->
      </div>

      <aside class="side-preview" id="side-preview">
        <p class="side-preview__title">הטבלה שלך</p>
        <div id="side-preview-list"></div>
      </aside>
    </div>

    <div class="footer-bar">
      <p class="footer-hint" id="footer-hint">הזן/י שם כדי להמשיך.</p>
      <button type="button" class="submit-btn" id="submit-btn" disabled>שליחת הניחוש</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js?v=9"></script>
  <script src="js/teams.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
